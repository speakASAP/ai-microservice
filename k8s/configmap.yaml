apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-microservice-config
  namespace: statex-apps
  labels:
    app: ai-microservice
    managed-by: k8s-migration
data:
  # Core/Cluster Configuration
  NODE_ENV: "production"
  SERVICE_NAME: "ai-microservice"
  DOMAIN: "ai.alfares.cz"
  PORT: "3380"
  LOG_LEVEL: "INFO"
  DEBUG: "false"

  # Auth/Logging (Already in K8s - use K8s DNS)
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  AUTH_PUBLIC_URL: "https://auth.alfares.cz"
  AI_ADMIN_AUTH_RETURN_URL: "https://ai.alfares.cz/admin/session"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"

  # Database Configuration (Host IP until Phase 4)
  DB_HOST: "db-server-postgres.statex-apps.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "ai"
  DB_NAME: "ai"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"

  # Redis/Cache Configuration (Host IP until Phase 4)
  REDIS_HOST: "192.168.88.53"
  REDIS_SERVER_PORT: "6379"
  REDIS_URL: "redis://192.168.88.53:6379/2"

  # Sub-services on Docker Compose (reached via host.k3s.internal)
  NLP_SERVICE_URL: "http://host.k3s.internal:3381"
  ASR_SERVICE_URL: "http://host.k3s.internal:3382"
  DOCUMENT_AI_URL: "http://host.k3s.internal:3383"
  PROTOTYPE_GENERATOR_URL: "http://host.k3s.internal:3384"
  TEMPLATE_REPOSITORY_URL: "http://host.k3s.internal:3385"
  FREE_AI_SERVICE_URL: "http://host.k3s.internal:3386"
  AI_WORKERS_URL: "http://host.k3s.internal:3387"
  GEMINI_AI_SERVICE_URL: "http://host.k3s.internal:3388"
  DATA_VIZ_SERVICE_URL: "http://host.k3s.internal:3389"
  # Host IP (host.k3s.internal does not resolve in all k3s pods)
  LITELLM_BASE_URL: "http://192.168.88.53:4000"

  # Search provider. DuckDuckGo HTML does not require a third-party API key; Serper still works when SEARCH_API_KEY is provided.
  SEARCH_API_URL: "https://html.duckduckgo.com/html/"

  # External Services
  NOTIFICATION_SERVICE_URL: "https://notifications.alfares.cz"

  # AI Modes
  ASR_MODE: "free"
  AI_MODE: "free"

  # LiteLLM routes /ai/complete (free/cheap/smart tiers).
  AI_COMPLETE_ROUTER: "litellm"
  # Claude Code jobs (/ai/claude-code-execute) — separate from /ai/complete
  CC_CLI_PATH: "/home/ssf/.local/bin/claude"
  CLAUDE_CONFIG_DIR: "/home/ssf/.claude"
  CC_CLI_TIMEOUT_MS: "120000"
  CODEX_CLI_PATH: "/home/ssf/.local/bin/codex"
  CODEX_HOME: "/home/ssf/.codex"
  CODEX_SANDBOX: "workspace-write"
  CODEX_APPROVAL_POLICY: "never"
  CLAUDE_CODE_DIRECT_EXECUTION: "true"
  CLAUDE_CODE_DIRECT_POLL_MS: "5000"
  CLAUDE_CODE_RATE_LIMIT_FALLBACK_PROVIDER: "litellm"
  # Tried in order. cheap leads: 813ms vs free 19.8s for the same reply (measured
  # 2026-08-09). free stays last — still free, just slow.
  CLAUDE_CODE_LITELLM_FALLBACK_MODELS: "cheap,free"
  CLAUDE_CODE_LITELLM_TIMEOUT_MS: "120000"
  # Per-attempt budget for the drilling generator, sized so TWO attempts (LlmClient
  # retries once on a transient failure) fit inside education-service's 180s client
  # timeout — 2x75s + overhead. At 120s a retry could not finish before the caller gave
  # up, which is the case that produced a red banner for the teacher on 2026-08-09.
  # Generous against measured latency: a 20-item generation takes ~21s on the smart tier.
  LITELLM_TIMEOUT_MS: "75000"
