apiVersion: v1
kind: Service
metadata:
  name: ai-microservice
  namespace: statex-apps
  labels:
    app: ai-microservice
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: ai-microservice
  ports:
    - protocol: TCP
      port: 3380
      targetPort: 3380
      name: http
