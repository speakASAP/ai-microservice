apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-microservice
  namespace: statex-apps
  labels:
    app: ai-microservice
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-microservice
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: localhost:5000/ai-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3380
              name: http
          envFrom:
            - configMapRef:
                name: ai-microservice-config
            - secretRef:
                name: ai-microservice-secret
          startupProbe:
            httpGet:
              path: /health
              port: 3380
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3380
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3380
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: HOME
              value: /home/ssf
            - name: CLAUDE_CONFIG_DIR
              value: /home/ssf/.claude
          volumeMounts:
            - name: local-bin
              mountPath: /home/ssf/.local
              readOnly: true
            - name: claude-config
              mountPath: /home/ssf/.claude
              readOnly: true
      volumes:
        - name: local-bin
          hostPath:
            path: /home/ssf/.local
            type: Directory
        - name: claude-config
          hostPath:
            path: /home/ssf/.claude
            type: Directory
