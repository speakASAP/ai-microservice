apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ai-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/ai-microservice
        property: DB_PASSWORD
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: GEMINI_API_KEY
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_SECRET
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: LITELLM_MASTER_KEY
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: OPENROUTER_API_KEY
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/ai-microservice
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: PAYMENT_WEBHOOK_API_KEY
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: REDIS_URL
    - secretKey: LOGGING_SERVICE_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: LOGGING_SERVICE_URL
