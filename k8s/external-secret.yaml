apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ai-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/ai-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_SECRET
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: LITELLM_MASTER_KEY
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: OPENROUTER_API_KEY
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: REDIS_URL
    - secretKey: LOGGING_SERVICE_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: LOGGING_SERVICE_URL
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: LANGFUSE_SECRET_KEY
    - secretKey: LANGFUSE_BASE_URL
      remoteRef:
        key: secret/prod/ai-microservice
        property: LANGFUSE_BASE_URL


    # RS256 keypair used only for the legacy ai-issued JWT path
    # (iss=ai-microservice). Close with ALLOW_LEGACY_AI_ISSUED=false after every
    # caller holds an Auth-minted principal, then prune these keys.
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_PUBLIC_KEY
    # Set to "false" to refuse ai-issued JWTs (Auth-minted RS256 only).
    - secretKey: ALLOW_LEGACY_AI_ISSUED
      remoteRef:
        key: secret/prod/ai-microservice
        property: ALLOW_LEGACY_AI_ISSUED
    # HS256 shared-secret window — already closed in Vault (=false).
    - secretKey: ALLOW_HS256_FALLBACK
      remoteRef:
        key: secret/prod/ai-microservice
        property: ALLOW_HS256_FALLBACK
