# LiteLLM proxy — routed model names: free, cheap, smart (see AGENTS.md).
# Secrets: use os.environ/VAR only (never commit keys).
#
# Host Ollama: must listen on 0.0.0.0:11434 (e.g. OLLAMA_HOST=0.0.0.0) so containers can reach it via
# OLLAMA_API_BASE (default http://host.docker.internal:11434). 127.0.0.1-only binds break /health from Docker.

model_list:
  - model_name: free
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: cheap
    litellm_params:
      model: openrouter/google/gemma-3-27b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      mode: completion

  - model_name: cheap-fallback
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: smart
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: completion

  - model_name: smart-fallback
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

router_settings:
  routing_strategy: least-busy
  fallbacks:
    - {"cheap": ["cheap-fallback"]}
    - {"smart": ["smart-fallback"]}
  num_retries: 3
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 120
