# LiteLLM proxy — routed model names: free, cheap, smart (see AGENTS.md).
# Secrets: use os.environ/VAR only (never commit keys).

model_list:
  - model_name: free
    litellm_params:
      model: ollama/gemma2:2b
      api_base: http://host.docker.internal:11434

  - model_name: cheap
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  - model_name: cheap-fallback
    litellm_params:
      model: ollama/gemma2:2b
      api_base: http://host.docker.internal:11434

  - model_name: smart
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: smart-fallback
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434

router_settings:
  routing_strategy: least-busy
  fallbacks:
    - {"cheap": ["cheap-fallback"]}
    - {"smart": ["smart-fallback"]}
  num_retries: 3
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 120
