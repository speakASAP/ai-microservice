# LiteLLM proxy — routed model names: free, cheap, smart (see AGENTS.md).
# Secrets: use os.environ/VAR only (never commit keys).
#
# Ollama: compose provides service `ollama` on nginx-network; OLLAMA_API_BASE defaults to
# http://ai-microservice-ollama:11434 (non-BG) or *-blue / *-green per color file. Override in .env if needed.
# Pull models into the volume, e.g.: docker exec -it ai-microservice-ollama ollama pull qwen2.5-coder:0.5b

model_list:
  - model_name: free
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: cheap
    litellm_params:
      model: openrouter/google/gemma-3-27b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      mode: completion

  - model_name: cheap-fallback
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: smart
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: completion

  - model_name: smart-fallback
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

router_settings:
  routing_strategy: least-busy
  fallbacks:
    - {"free": ["cheap"]}
    - {"cheap": ["cheap-fallback"]}
    - {"smart": ["smart-fallback"]}
  num_retries: 3
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 120
