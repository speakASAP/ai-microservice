# LiteLLM proxy — routed model names: free, cheap, smart (see AGENTS.md).
# Secrets: use os.environ/VAR only (never commit keys).
#
# Ollama: compose provides service `ollama` on nginx-network. OLLAMA_API_BASE is
# http://ai-microservice-ollama-green:11435 — the container sets OLLAMA_HOST=0.0.0.0:11435,
# so it listens on 11435, NOT the 11434 default. Verified 2026-07-31 from inside the
# litellm container: /api/tags 200 in 0.01s, /api/generate 200 in ~18s.
# Pull models into the volume, e.g.: docker exec -it ai-microservice-ollama-green ollama pull qwen2.5-coder:0.5b
#
# 2026-07-31 — every tier was down and every request 500'd after a 120s hang. Causes:
#   * `smart` pointed at gemini/gemini-2.0-flash, but Gemini is not used here (no funded key).
#   * `cheap` pointed at openrouter/google/gemma-3-27b-it:free, which OpenRouter has RETIRED
#     (404: "use google/gemma-3-27b-it" — the paid slug). Its whole free catalogue rotates,
#     so a pinned :free slug is a time bomb: re-verify with
#       curl -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/models
#   * every fallback chained to Ollama, which answers fine but is a 0.5b CPU model — far too
#     slow for long drill prompts, so 3 retries blew past request_timeout.
# Now: OpenRouter free models across two vendors, no single-vendor dependency, Ollama kept
# only as the local `free` tier. All slugs below verified returning real completions.

model_list:
  # Local, no API cost, slow (CPU inference). Fine for short prompts; falls back to `cheap`.
  - model_name: free
    litellm_params:
      model: ollama/qwen2.5-coder:0.5b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: cheap
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      mode: completion

  # Different vendor from `cheap` on purpose — one vendor retiring a slug must not take
  # both the primary and its fallback down at once.
  - model_name: cheap-fallback
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-30b-a3b:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      mode: completion

  - model_name: smart
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      mode: completion

  - model_name: smart-fallback
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      mode: completion

router_settings:
  routing_strategy: least-busy
  fallbacks:
    - {"free": ["cheap"]}
    - {"cheap": ["cheap-fallback"]}
    - {"smart": ["smart-fallback"]}
  # 2026-08-14 — a drill generation hung and the teacher got a red banner after ~150s.
  # The budgets were nested inside-out: the caller (ai-microservice, LITELLM_TIMEOUT_MS
  # 75s) aborted while THIS proxy was still working through `request_timeout: 120` on
  # attempt 1 of 4. The fallback below therefore never ran once in production — the
  # client always gave up first, and the retry it then did upstream repeated the whole
  # dead chain. Uvicorn only access-logs completed requests, so the aborted attempts
  # left no trace here, which is why the proxy looked healthy throughout.
  #
  # Budgets must nest: one attempt + one fallback + backoff must finish INSIDE the
  # caller's timeout, or the fallback is decorative. The caller's 75s is itself pinned
  # from above — education-service allows 180s and LlmClient retries once, so 2x75s is
  # the ceiling and LITELLM_TIMEOUT_MS cannot simply be raised to make room here.
  # 30 + 30 + 5 = 65s worst case, under 75s with headroom for connect + JSON parse.
  # Retries dropped 3 -> 1: with a fallback model configured, retrying a stalled vendor
  # three times only burns the budget the fallback needs to reach a different vendor.
  num_retries: 1
  retry_after: 5

litellm_settings:
  drop_params: true
  # Per-attempt, NOT per-request: the router multiplies this by attempts + fallbacks.
  # Real drill generations complete in 8-19s (measured 2026-08-14 against `smart`,
  # `smart-fallback` and `cheap`), so 30s is well clear of normal latency; anything
  # slower is a stalled vendor, and switching vendors beats waiting it out.
  request_timeout: 30
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
